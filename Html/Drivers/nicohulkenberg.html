<body>

<header>

</header>

<main class="container mt-5">

  <h1 id="driver-name">Laddar...</h1>

<fieldset class="mt-4">

  <div class="driver-info">

    <div class="driver-text">
      <p><b>Nummer:</b> <span id="driver-number"></span></p>
      <p><b>Team:</b> <span id="team-name"></span></p>
      <p><b>Nationalitet:</b> <span id="country"></span></p>
    </div>

    <img id="headshot-url" class="driver-headshot" src="" alt="Förarens bild">

  </div>

</fieldset>



</main>

<footer class="text-center mt-5">
  <p>© 2026</p>
</footer>
